name: Basics

# This will deactivate IPv6 for management interfaces. Sometimes templates or AVD won't
# configure an IPv6 address on a management interface, and Linux will try IPv6 first, 
# causing a delay. 

mgmt:
  network: mgmt
  ipv6-subnet: 
  ipv4-subnet: 172.20.20.0/24
prefix: ""  # This will keep "leaf1" as "leaf1", instead of clab-clos-medium-leaf1

# If you want the Management network on a physical/virual LAN, attach a NIC to the mgmt-net Linux bridge, otherwise leave this commented out
# mgmt:
#   network: mgmt-net            
#   bridge: mgmt-net

topology:
  kinds:
    ceos:
      env:
        CLAB_MGMT_VRF: MGMT
  nodes:
    leaf1:
      kind: ceos
      image: ceos:4.36.2F
      mgmt-ipv4: 172.20.20.11
    leaf2:
      kind: ceos
      image: ceos:4.36.2F
      mgmt-ipv4: 172.20.20.12
    leaf3:
      kind: ceos
      image: ceos:4.36.2F
      mgmt-ipv4: 172.20.20.13
    spine1:
      kind: ceos
      image: ceos:4.36.2F
      mgmt-ipv4: 172.20.20.101
    l2ext1:
      kind: ceos
      image: ceos:4.36.2F
      mgmt-ipv4: 172.20.20.15
    host1:
      kind: ceos
      image: ceos:4.36.2F
      mgmt-ipv4: 172.20.20.91
    host2:
      kind: ceos
      image: ceos:4.36.2F
      mgmt-ipv4: 172.20.20.92
    host3:
      kind: ceos
      image: ceos:4.36.2F
      mgmt-ipv4: 172.20.20.93
    R1:
      kind: ceos
      image: ceos:4.36.2F
      mgmt-ipv4: 172.20.20.94
    R2: 
      kind: ceos
      image: ceos:4.36.2F
      mgmt-ipv4: 172.20.20.95

  links:
    - endpoints: ["leaf1:eth1", "spine1:eth1"]
    - endpoints: ["leaf1:eth2", "spine1:eth2"]
    - endpoints: ["leaf1:eth3", "spine1:eth3"]
    - endpoints: ["leaf2:eth1", "spine1:eth4"]
    - endpoints: ["leaf2:eth2", "spine1:eth5"]
    - endpoints: ["leaf3:eth1", "spine1:eth6"]
    - endpoints: ["leaf3:eth2", "spine1:eth7"]

    - endpoints: ["l2ext1:eth1", "leaf3:eth3"]
    - endpoints: ["l2ext1:eth2", "leaf3:eth4"]


    - endpoints: ["host1:eth1", "leaf1:eth4"]
    - endpoints: ["host2:eth1", "leaf2:eth4"]
    - endpoints: ["host3:eth1", "l2ext1:eth3"]
    - endpoints: ["host3:eth2", "l2ext1:eth4"]


    - endpoints: ["R1:eth1", "spine1:eth8"]
    - endpoints: ["R1:eth2", "spine1:eth9"]
    - endpoints: ["R2:eth1", "spine1:eth10"]
    - endpoints: ["R2:eth2", "spine1:eth11"]
