    ansible_httpapi_validate_certs: False
    ansible_httpapi_port: 443
    ansible_become: yes
    ansible_become_method: enable
  children:
    INFRA:
      children:
        ROUTERS:
          hosts:
            R1:
            R2:
        HOSTS:
          hosts: 
            host1:
            host2:
            host3:
    FABRIC:
      children:
        SPINES:
          hosts:
            spine1:
        LEAFS:
          hosts:
            leaf1:
            leaf2:
            leaf3:
            l2ext1:
